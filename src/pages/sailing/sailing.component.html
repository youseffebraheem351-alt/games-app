<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-blue-900 via-purple-900 to-gray-800">

    <div class="p-10 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">

        @for (item of sailingdata; track item.id) {
            <!-- Card 1 -->
            <div [routerLink]="['/gamesdetails',item.id]" class="group bg-gradient-to-r from-teal-600 to-blue-700 hover:bg-gradient-to-r hover:from-teal-500 hover:to-blue-600 rounded-2xl shadow-lg overflow-hidden transform transition-all duration-300 ease-in-out hover:scale-105 cursor-pointer">
                <div class="relative">
                    <img [src]="item.thumbnail" alt="League of Legends" class="game-img w-full h-40 object-cover transition-all duration-300 ease-in-out group-hover:opacity-90 rounded-t-2xl">
                </div>
                <div class="p-6 space-y-3">
                    <div class="flex items-center justify-between">
                        <h2 class="font-bold text-white text-2xl">{{item.title}}</h2>
                        <span class="bg-gradient-to-r from-yellow-400 to-red-500 text-white text-xs px-3 py-1 rounded-full">Free</span>
                    </div>
                    <p class="text-gray-200 text-sm leading-snug">{{item.short_description}}</p>
                    <div class="flex flex-wrap gap-3 pt-2">
                        <span class="bg-gray-800 text-xs px-3 py-1 rounded-full text-yellow-300">MOBA</span>
                        <span class="bg-gray-800 text-xs px-3 py-1 rounded-full text-yellow-300">PC (Windows)</span>
                    </div>
                </div>
            </div>
        }

    </div>

</body>
</html>
